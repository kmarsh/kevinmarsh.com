baseURL: https://kevinmarsh.com
disablePathToLower: true
locale: en-us
title: Kevin Marsh
permalinks:
  posts: /:year/:month/:day/:slug/
markup:
  highlight:
    noClasses: false
    tabWidth: 2
  goldmark:
    renderer:
      unsafe: true

outputFormats:
  RSS:
    mediatype: "application/rss"
    baseName: feed

security:
  allowContent:
    - '! ^text/org$'
  node:
    permissions:
      # PostCSS/autoprefixer's browserslist walks up to the filesystem root
      # looking for config, which Hugo's default allowRead ('.') blocks.
      allowRead:
        - '*'
  exec:
    osEnv:
      - '(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$'
      - ^ASDF_DIR$
      - ^HOME$
